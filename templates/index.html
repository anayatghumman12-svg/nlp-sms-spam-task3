<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMS Spam Classifier</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .card {
            background: #fff;
            width: 100%;
            max-width: 560px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .icon {
            font-size: 42px;
        }

        h1 {
            font-size: 24px;
            margin: 8px 0 4px;
            color: #1f2937;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 130px;
            padding: 14px;
            font-size: 15px;
            font-family: inherit;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover {
            opacity: 0.92;
        }

        button:active {
            transform: scale(0.99);
        }

        .result {
            margin-top: 22px;
            padding: 18px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-icon {
            font-size: 28px;
        }

        .result-text {
            flex: 1;
        }

        .result-label {
            font-size: 17px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-confidence {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 2px;
        }

        .result.spam {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .result.ham {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="icon">🛡️</div>
            <h1>SMS Spam Classifier</h1>
            <p class="subtitle">Paste any SMS message to check if it's spam or ham</p>
        </div>

        <form action="/predict" method="post">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="e.g. WINNER!! Call 09061701461 now to claim your free prize...">{{ submitted_message or "" }}</textarea>
            <button type="submit">Analyze Message</button>
        </form>

        {% if result %}
        <div class="result {{ result.label }}">
            <div class="result-icon">{{ "🚫" if result.label == "spam" else "✅" }}</div>
            <div class="result-text">
                <div class="result-label">{{ result.label }}</div>
                <div class="result-confidence">Confidence: {{ result.confidence }}%</div>
            </div>
        </div>
        {% endif %}

        <p class="footer-note">Powered by TF-IDF + Linear SVM</p>
    </div>
</body>
</html>
